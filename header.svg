<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Small tools. Useful AI.</title>
  <desc id="desc">A blueprint-inspired banner about turning a problem into a useful open-source tool.</desc>
